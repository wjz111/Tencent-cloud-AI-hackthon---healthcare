<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test Page</title></head>
<body>
<div id="root"></div>
<script src="/react.production.min.js"></script>
<script src="/react-dom.production.min.js"></script>
<script src="/babel.min.js"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(
    <div style={{padding:40,textAlign:'center',fontFamily:'sans-serif'}}>
      <h1 style={{color:'#4CAF50'}}>React is working!</h1>
      <p>If you see this, React + Babel loaded successfully.</p>
    </div>
  );
</script>
<script>
  setTimeout(function() {
    if (!document.querySelector('#root > div')) {
      document.getElementById('root').innerHTML = '<div style="padding:40px;color:red;font-family:sans-serif;">' +
        '<h2>React did not render</h2>' +
        '<p>React loaded: ' + (typeof React !== 'undefined') + '</p>' +
        '<p>ReactDOM loaded: ' + (typeof ReactDOM !== 'undefined') + '</p>' +
        '<p>Babel loaded: ' + (typeof Babel !== 'undefined') + '</p>' +
        '</div>';
    }
  }, 5000);
</script>
</body>
</html>
